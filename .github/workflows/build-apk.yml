name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure fixed debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "Add fixed debug keystore [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "debug.keystore already exists, skipping generation."
          fi

      - name: Bump versionCode and versionName on runner
        run: |
          sed -i -E 's/^([[:space:]]*)versionCode = 1[[:space:]]*$/\1versionCode = ${{ github.run_number }}/' app/build.gradle.kts || true
          sed -i -E 's/^([[:space:]]*)versionName = "1\.0"[[:space:]]*$/\1versionName = "1.0.${{ github.run_number }}"/' app/build.gradle.kts || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PrintX-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
